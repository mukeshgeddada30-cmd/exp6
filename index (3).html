<!DOCTYPE html>
<html>
<head>
<title>Student Result Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>Student Result Management System</h1>
<form id="resultForm">
<input type="text" id="name" placeholder="Student Name" required>
<input type="text" id="roll" placeholder="Roll Number" required>
<input type="number" id="math" placeholder="Maths Marks" min="0" max="100" required>
<input type="number" id="science" placeholder="Science Marks" min="0" max="100" required>
<input type="number" id="english" placeholder="English Marks" min="0" max="100" required>
<button type="submit">Calculate Result</button>
<button type="reset">Clear</button>
</form>
<div id="result"></div>
</div>
<script src="script.js"></script>
</body>
</html>
